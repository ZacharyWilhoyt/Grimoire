[package]
name = "grimoire-api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs", "sync"] }
tower-http = { version = "0.6", features = ["trace", "fs"] }
argon2 = "0.5"
axum-extra = { version = "0.12", features = ["cookie"] }
dotenvy = "0.15"
hex = "0.4"
rand = "0.8"
rpassword = "7"
sha2 = "0.10"
subtle = "2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "macros", "migrate"] }
time = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
